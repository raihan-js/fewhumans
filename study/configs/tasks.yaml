# FewHumans study — task shortlist (Phase 3 plan, 2026-10-10)
# Status of each field: VERIFIED (checked 2026-10-10) or VERIFY-AT-BUILD.
# Ground truth for simulation = the human label (spec §7: "what a full human
# labeling would conclude"). Licence column governs what the JudgeBank (D3) may
# redistribute: outputs + IDs always; item text only if the licence allows.

tasks:
  - id: summeval-consistency
    source: mteb/summeval  # VERIFIED exists; licence VERIFY-AT-BUILD (check card)
    label_space: ordinal(1..5)
    estimand: mean consistency of one summarizer (16 systems; pick mid-quality)
    n_items: 100 summaries x 1 system (experts' mean as truth)
    note: 2019-era models; possible ceiling effects (validity unaffected)

  - id: mtbench-winrate
    source: lmsys/mt_bench_human_judgments  # VERIFIED, CC-BY-4.0, 3,355 rows
    label_space: pairwise(A/B/tie)
    estimand: win rate of alpaca-13b over gpt-3.5-turbo (ties = 0.5)
    n_items: all rows for the pair (318)

  - id: arena-winrate
    source: lmarena-ai/arena-human-preference-55k  # VERIFIED, Apache-2.0
    label_space: pairwise(A/B/tie)
    estimand: win rate on a subsample of 800 battles (one language slice)
    n_items: 800
    note: single rater per battle; truth = that rater's verdict (documented)

  - id: helpsteer2-correctness
    source: nvidia/HelpSteer2  # VERIFIED, CC-BY-4.0, 21.4k rows
    label_space: ordinal(0..4)
    estimand: mean correctness over a 800-item slice
    n_items: 800

  - id: wmt-mqm
    source: google/wmt-mqm-human-evaluation (GitHub, original)  # VERIFIED exists
    mirror: RicardoRei/wmt-mqm-human-evaluation  # unofficial; prefer original
    licence: VERIFY-AT-BUILD (check repo)
    label_space: real (MQM score, negative; normalize documented range)
    estimand: mean MQM score of one system (en-de, Online-W only system in mirror, 2,371 segs)
    n_items: 500 segments

  - id: toxicity-flag
    source: google/civil_comments  # VERIFIED, CC0, exact Jigsaw replica
    label_space: binary
    estimand: mean toxicity rate of the slice (balanced ~50/50 by construction)
    n_items: 800

  - id: fedproc-roles
    status: DROPPED 2026-10-10 (verify-at-build FAILED, see docs/decisions.md)
    reason: >
      local "gold" (labeled_mentions.parquet) is audit/model-consensus labels,
      not human labels (no human experts per PROJECTS.md; VETR reviewer gold
      pending); and mention contexts cannot be joined reliably (no clause
      number in gold, doc-only match shows the wrong mention). Parquets kept
      as weak-truth secondary data only, excluded from the main study.
    source: local fedproc-ledger (owner's own project)

  - id: oraclebench-truth
    source: local oraclebench / HF raihan-js/oraclebench-items (owner's own)
    label_space: binary, deterministic oracle truth
    estimand: judge accuracy vs oracle
    n_items: 800

  # Optional (time permitting, in this order):
  # - hanna-story (ordinal; VERIFY-AT-BUILD: GitHub availability, licence)
  # - conll-ner (span F1 ratio estimand; VERIFY-AT-BUILD: licence/redistribution)
